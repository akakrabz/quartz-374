1="550" y1="40" x2="550" y2="220" stroke="currentColor" stroke-width="0.6" stroke-linecap="round" opacity="0.45"/><line x1="400" y1="220" x2="580" y2="220" stroke="currentColor" stroke-width="0.6" stroke-linecap="round" opacity="0.45"/><line x1="580" y1="40" x2="580" y2="220" stroke="currentColor" stroke-width="0.6" stroke-linecap="round" opacity="0.45"/><rect x="400" y="40" width="180" height="180" rx="0" fill="none" stroke="currentColor" stroke-width="1.1"/><text x="388" y="115" text-anchor="middle" dominant-baseline="central" fill="currentColor" style="font-size:14px;font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif;font-style:italic;">r</text><text x="388" y="175" text-anchor="middle" dominant-baseline="central" fill="currentColor" style="font-size:14px;font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif;font-style:italic;">u</text><text x="475" y="28" text-anchor="middle" dominant-baseline="central" fill="currentColor" style="font-size:14px;font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif;font-style:italic;">r</text><text x="565" y="28" text-anchor="middle" dominant-baseline="central" fill="currentColor" style="font-size:14px;font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif;font-style:italic;">v</text><text x="475" y="116" text-anchor="middle" dominant-baseline="central" fill="currentColor" style="font-size:13px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;">0</text><rect x="463" y="163" width="24" height="24" rx="4" fill="var(--accent)" fill-opacity="0.2" stroke="var(--accent)" stroke-width="1.4"/><rect x="553" y="103" width="24" height="24" rx="4" fill="var(--accent)" fill-opacity="0.2" stroke="var(--accent)" stroke-width="1.4"/><rect x="553" y="163" width="24" height="24" rx="4" fill="var(--hi)" fill-opacity="0.2" stroke="var(--hi)" stroke-width="1.4"/><path d="M485.0,175.0 L553.0,175.0" fill="none" stroke="var(--accent)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ARR)"/><path d="M565.0,125.0 L565.0,163.0" fill="none" stroke="var(--accent)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ARR)"/><text x="490" y="236" text-anchor="middle" dominant-baseline="central" fill="currentColor" style="font-size:12px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;">dist[u, v] ← min{dist[u, v], dist[u, r] + dist[r, v]}</text></svg><figcaption><strong>The recursive structure behind Floyd–Warshall.</strong> Left: a shortest path from <i>u</i> to <i>v</i> whose intermediate vertices are at most <i>r</i> either avoids <i>r</i>, or passes through <i>r</i> exactly once and splits there into two paths with intermediate vertices at most <i>r</i> − 1 (the book’s Figure 9.3). Right: in phase <i>r</i>, entry (<i>u</i>, <i>v</i>) reads entries (<i>u</i>, <i>r</i>) and (<i>r</i>, <i>v</i>), which lie in column <i>r</i> and row <i>r</i>. Those do not change during phase <i>r</i>, because dist[<i>r</i>, <i>r</i>] = 0 — so one matrix, updated in place, suffices.</figcaption></figure>
