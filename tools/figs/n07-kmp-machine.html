ail</text></svg><figcaption><strong>The string-matching machine for <code>ABRACADABRA</code>.</strong> Thick arrows are success edges: on a match, move right and read the next text character. Above the row, the failure edges <i>j</i> → <i>fail</i>[<i>j</i>] (0 1 1 1 2 1 2 1 2 3 4); below, the optimized ones (0 1 1 0 2 0 2 0 1 1 0), which skip every node carrying the same letter as <i>j</i>. A failure edge reads no input. The start node <code>&#36;</code> is node 0 and always succeeds; node <i>j</i> holds <i>P</i>[<i>j</i>]; reaching the final node <code>!</code> means the pattern was found.</figcaption></figure>
