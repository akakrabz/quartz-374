:15px;font-family:'JetBrains Mono','IBM Plex Mono',ui-monospace,monospace;">•</text><circle cx="272.2" cy="96" r="12" fill="var(--paper)" stroke="currentColor" stroke-width="1.2"/><text x="272.2" y="96" text-anchor="middle" dominant-baseline="central" fill="currentColor" style="font-size:15px;font-family:'JetBrains Mono','IBM Plex Mono',ui-monospace,monospace;">•</text><circle cx="210.6" cy="58" r="12" fill="var(--paper)" stroke="currentColor" stroke-width="1.2"/><text x="210.6" y="58" text-anchor="middle" dominant-baseline="central" fill="currentColor" style="font-size:15px;font-family:'JetBrains Mono','IBM Plex Mono',ui-monospace,monospace;">+</text><text x="359.5" y="132" text-anchor="start" dominant-baseline="central" fill="var(--hi)" style="font-size:13px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;">subexpression (0+1)*00</text><text x="188.6" y="58" text-anchor="end" dominant-baseline="central" fill="var(--muted)" style="font-size:12px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;">root</text><text x="260" y="288" text-anchor="middle" dominant-baseline="central" fill="var(--muted)" style="font-size:12px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;">size 10: five internal nodes (+, •, •, *, +) and five leaves (0, 1, 0, 1, 00)</text></svg><figcaption><strong>The expression tree of 0+1(0+1)*00.</strong> Star binds tightest and + loosest, so the root is the + and the string 00 is a single leaf. Every subtree is a <em>subexpression</em>; the red one is (0+1)*00. The substring 0+1(0+1)* is a well-formed expression too, but no subtree spells it, so it is not a subexpression.</figcaption></figure>
