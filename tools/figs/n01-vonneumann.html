<figure class="cs-fig"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 250" width="560" height="250" role="img" style="font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;font-size:13px"><title>probability tree of two biased coin flips; outcomes 10 and 01 return a bit, 11 and 00 start over</title><defs><marker id="ARR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs><circle cx="40" cy="136" r="7" fill="currentColor" stroke="currentColor" stroke-width="1.6"/><text x="40" y="158" text-anchor="middle" dominant-baseline="central" fill="var(--muted)" style="font-size:12px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;">start</text><line x1="48" y1="132" x2="174" y2="86" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ARR)"/><circle cx="190" cy="80" r="14" fill="var(--paper)" stroke="currentColor" stroke-width="1.6"/><text x="190" y="81" text-anchor="middle" dominant-baseline="central" fill="currentColor" style="font-size:13px;font-family:'JetBrains Mono','IBM Plex Mono',ui-monospace,monospace;">1</text><text x="109" y="96" text-anchor="middle" dominant-baseline="central" fill="currentColor" style="font-size:15px;font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif;font-style:italic;paint-order:stroke;stroke:var(--paper);stroke-width:5px;stroke-linejoin:round;">p</text><line x1="48" y1="140" x2="174" y2="186" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ARR)"/><circle cx="190" cy="192" r="14" fill="var(--paper)" stroke="currentColor" stroke-width="1.6"/><text x="190" y="193" text-anchor="middle" dominant-baseline="central" fill="currentColor" style="font-size:13px;font-family:'JetBrains Mono','IBM Plex Mono',ui-monospace,monospace;">0</text><text x="109" y="176" text-anchor="middle" dominant-baseline="central" fill="currentColor" style="font-size:15px;font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif;font-style:italic;paint-order:stroke;stroke:var(--paper);stroke-width:5px;stroke-linejoin:round;">q</text><text x="190" y="16" text-anchor="middle" dominant-baseline="central" fill="var(--muted)" style="font-size:12px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;">first flip x</text><line x1="205" y1="76" x2="344" y2="50" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ARR)"/><circle cx="360" cy="50" r="14" fill="var(--paper)" stroke="currentColor" stroke-width="1.6"/><text x="360" y="51" text-anchor="middle" dominant-baseline="central" fill="currentColor" style="font-size:13px;font-family:'JetBrains Mono','IBM Plex Mono',ui-monospace,monospace;">1</text><text x="277" y="55" text-anchor="middle" dominant-baseline="central" fill="currentColor" style="font-size:15px;font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif;font-style:italic;paint-order:stroke;stroke:var(--paper);stroke-width:5px;stroke-linejoin:round;">p</text><text x="386" y="50" text-anchor="start" dominant-baseline="central" fill="currentColor" style="font-size:15px;font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif;font-style:italic;">p²</text><text x="424" y="50" text-anchor="start" dominant-baseline="central" fill="currentColor" style="font-size:13px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;">flip both again</text><line x1="205" y1="84" x2="344" y2="110" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ARR)"/><circle cx="360" cy="110" r="14" fill="var(--paper)" stroke="var(--hi)" stroke-width="2"/><text x="360" y="111" text-anchor="middle" dominant-baseline="central" fill="var(--hi)" style="font-size:13px;font-family:'JetBrains Mono','IBM Plex Mono',ui-monospace,monospace;">0</text><text x="277" y="105" text-anchor="middle" dominant-baseline="central" fill="currentColor" style="font-size:15px;font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif;font-style:italic;paint-order:stroke;stroke:var(--paper);stroke-width:5px;stroke-linejoin:round;">q</text><text x="386" y="110" text-anchor="start" dominant-baseline="central" fill="var(--hi)" style="font-size:15px;font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif;font-style:italic;">pq</text><text x="424" y="110" text-anchor="start" dominant-baseline="central" fill="var(--hi)" style="font-size:13px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;font-weight:600;">return 1</text><line x1="205" y1="188" x2="344" y2="162" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ARR)"/><circle cx="360" cy="162" r="14" fill="var(--paper)" stroke="var(--hi)" stroke-width="2"/><text x="360" y="163" text-anchor="middle" dominant-baseline="central" fill="var(--hi)" style="font-size:13px;font-family:'JetBrains Mono','IBM Plex Mono',ui-monospace,monospace;">1</text><text x="277" y="167" text-anchor="middle" dominant-baseline="central" fill="currentColor" style="font-size:15px;font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif;font-style:italic;paint-order:stroke;stroke:var(--paper);stroke-width:5px;stroke-linejoin:round;">p</text><text x="386" y="162" text-anchor="start" dominant-baseline="central" fill="var(--hi)" style="font-size:15px;font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif;font-style:italic;">qp</text><text x="424" y="162" text-anchor="start" dominant-baseline="central" fill="var(--hi)" style="font-size:13px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;font-weight:600;">return 0</text><line x1="205" y1="196" x2="344" y2="222" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ARR)"/><circle cx="360" cy="222" r="14" fill="var(--paper)" stroke="currentColor" stroke-width="1.6"/><text x="360" y="223" text-anchor="middle" dominant-baseline="central" fill="currentColor" style="font-size:13px;font-family:'JetBrains Mono','IBM Plex Mono',ui-monospace,monospace;">0</text><text x="277" y="217" text-anchor="middle" dominant-baseline="central" fill="currentColor" style="font-size:15px;font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif;font-style:italic;paint-order:stroke;stroke:var(--paper);stroke-width:5px;stroke-linejoin:round;">q</text><text x="386" y="222" text-anchor="start" dominant-baseline="central" fill="currentColor" style="font-size:15px;font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif;font-style:italic;">q²</text><text x="424" y="222" text-anchor="start" dominant-baseline="central" fill="currentColor" style="font-size:13px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;">flip both again</text><text x="360" y="16" text-anchor="middle" dominant-baseline="central" fill="var(--muted)" style="font-size:12px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;">second flip y</text></svg><figcaption><strong>One round of von Neumann’s coin.</strong> Two independent flips of a coin that shows 1 with unknown probability <i>p</i> (and 0 with probability <i>q</i> = 1 − <i>p</i>). The outcomes 10 and 01 have the same probability <i>pq</i>, so a round that stops returns 1 or 0 with probability 1/2 each. A round stops with probability 2<i>pq</i>, so the number of rounds is geometric with mean 1/(2<i>pq</i>) and the expected number of flips is 1/(<i>pq</i>): 9/2 for <i>p</i> = 1/3, and 4 for a fair coin.</figcaption></figure>
