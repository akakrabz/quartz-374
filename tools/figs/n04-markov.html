vg><figcaption><strong>Markov’s inequality as an area (after the note’s figure on p. 1).</strong> <i>Z</i> = the number of heads in 6 fair coin flips. The staircase is Pr[<i>Z</i> ≥ <i>z</i>]; cutting the region under it into columns of width 1 shows that its area is Pr[<i>Z</i> ≥ 1] + … + Pr[<i>Z</i> ≥ 6] = 192/64 = E[<i>Z</i>] = 3. The darker rectangle of width <i>z</i> = 4 and height Pr[<i>Z</i> ≥ 4] = 22/64 fits under the staircase, so its area, 11/8, is at most 3: Pr[<i>Z</i> ≥ 4] ≤ 3/4. (The true value is 22/64 ≈ 0.34.)</figcaption></figure>
