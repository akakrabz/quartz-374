<figure class="cs-fig"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 215" width="520" height="215" role="img" style="font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;font-size:14px"><title>an edge u to v with bounds and cost, replaced by a vertex z with edges from u and from v</title><defs><marker id="ARR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs><path d="M260,82 L260,118" fill="none" stroke="var(--muted)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ARR)"/><path d="M88,45 L429.5,45" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ARR)"/><path d="M88,165 L239.5,165" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ARR)"/><path d="M432,165 L280.5,165" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ARR)"/><circle cx="70" cy="45" r="18" fill="var(--paper)" stroke="currentColor" stroke-width="1.6"/><text x="70" y="46" text-anchor="middle" dominant-baseline="central" fill="currentColor" style="font-size:15px;font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif;font-style:italic;">u</text><circle cx="450" cy="45" r="18" fill="var(--paper)" stroke="currentColor" stroke-width="1.6"/><text x="450" y="46" text-anchor="middle" dominant-baseline="central" fill="currentColor" style="font-size:15px;font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif;font-style:italic;">v</text><circle cx="70" cy="165" r="18" fill="var(--paper)" stroke="currentColor" stroke-width="1.6"/><text x="70" y="166" text-anchor="middle" dominant-baseline="central" fill="currentColor" style="font-size:15px;font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif;font-style:italic;">u</text><circle cx="260" cy="165" r="18" fill="var(--paper)" stroke="currentColor" stroke-width="1.6"/><text x="260" y="166" text-anchor="middle" dominant-baseline="central" fill="currentColor" style="font-size:15px;font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif;font-style:italic;">z</text><circle cx="450" cy="165" r="18" fill="var(--paper)" stroke="currentColor" stroke-width="1.6"/><text x="450" y="166" text-anchor="middle" dominant-baseline="central" fill="currentColor" style="font-size:15px;font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif;font-style:italic;">v</text><text x="260" y="30" text-anchor="middle" dominant-baseline="central" fill="currentColor" style="font-size:13px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;paint-order:stroke;stroke:var(--paper);stroke-width:5px;stroke-linejoin:round;">ℓ ≤ f ≤ c,  cost k</text><text x="165" y="150" text-anchor="middle" dominant-baseline="central" fill="currentColor" style="font-size:13px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;paint-order:stroke;stroke:var(--paper);stroke-width:5px;stroke-linejoin:round;">f − ℓ ≥ 0</text><text x="165" y="182" text-anchor="middle" dominant-baseline="central" fill="var(--accent)" style="font-size:13px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;paint-order:stroke;stroke:var(--paper);stroke-width:5px;stroke-linejoin:round;">cost k</text><text x="355" y="150" text-anchor="middle" dominant-baseline="central" fill="currentColor" style="font-size:13px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;paint-order:stroke;stroke:var(--paper);stroke-width:5px;stroke-linejoin:round;">c − f ≥ 0</text><text x="355" y="182" text-anchor="middle" dominant-baseline="central" fill="var(--accent)" style="font-size:13px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;paint-order:stroke;stroke:var(--paper);stroke-width:5px;stroke-linejoin:round;">cost 0</text><text x="70" y="82" text-anchor="middle" dominant-baseline="central" fill="var(--accent2)" style="font-size:13px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;paint-order:stroke;stroke:var(--paper);stroke-width:5px;stroke-linejoin:round;">b(u)</text><text x="450" y="82" text-anchor="middle" dominant-baseline="central" fill="var(--accent2)" style="font-size:13px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;paint-order:stroke;stroke:var(--paper);stroke-width:5px;stroke-linejoin:round;">b(v)</text><text x="70" y="202" text-anchor="middle" dominant-baseline="central" fill="var(--accent2)" style="font-size:13px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;paint-order:stroke;stroke:var(--paper);stroke-width:5px;stroke-linejoin:round;">b(u) + ℓ</text><text x="260" y="202" text-anchor="middle" dominant-baseline="central" fill="var(--accent2)" style="font-size:13px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;paint-order:stroke;stroke:var(--paper);stroke-width:5px;stroke-linejoin:round;">c − ℓ</text><text x="450" y="202" text-anchor="middle" dominant-baseline="central" fill="var(--accent2)" style="font-size:13px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;paint-order:stroke;stroke:var(--paper);stroke-width:5px;stroke-linejoin:round;">b(v) − c</text></svg><figcaption><strong>Removing the bounds from one edge (Fulkerson; the note’s figure on p. 11).</strong> The edge <i>u</i>→<i>v</i> with bounds ℓ ≤ <i>f</i> ≤ <i>c</i> and cost <i>k</i> becomes a new vertex <i>z</i> with two uncapacitated edges into it, <i>u</i>→<i>z</i> carrying <i>f</i> − ℓ at cost <i>k</i> and <i>v</i>→<i>z</i> carrying <i>c</i> − <i>f</i> at cost 0. Balances (flow in − flow out) are written below the vertices: <i>z</i> absorbs exactly <i>c</i> − ℓ, so both new flows are non-negative exactly when ℓ ≤ <i>f</i> ≤ <i>c</i>, and every cost drops by the constant ℓ<i>k</i>.</figcaption></figure>
