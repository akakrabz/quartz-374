<figure class="cs-fig"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 170" width="600" height="170" role="img" style="font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;font-size:14px"><title>schematic: strings x and y reach the same state q, then z leads to r</title><defs><marker id="ARR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs><defs><marker id="ARR2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs><circle cx="70" cy="85" r="19" fill="var(--paper)" stroke="currentColor" stroke-width="1.6"/><text x="70" y="86" text-anchor="middle" dominant-baseline="central" fill="currentColor" style="font-size:15px;font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif;font-style:italic;">s</text><line x1="20" y1="85" x2="48" y2="85" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ARR)"/><circle cx="300" cy="85" r="19" fill="var(--paper)" stroke="var(--hi)" stroke-width="1.6"/><text x="300" y="86" text-anchor="middle" dominant-baseline="central" fill="var(--hi)" style="font-size:15px;font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif;font-style:italic;">q</text><circle cx="520" cy="85" r="19" fill="var(--paper)" stroke="currentColor" stroke-width="1.6"/><circle cx="520" cy="85" r="23" fill="var(--paper)" stroke="currentColor" stroke-width="1.6"/><text x="520" y="86" text-anchor="middle" dominant-baseline="central" fill="currentColor" style="font-size:15px;font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif;font-style:italic;">r</text><path d="M88,76 C150,20 230,20 284,72" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ARR)" stroke-dasharray="5 4"/><path d="M88,94 C150,150 230,150 284,98" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ARR)" stroke-dasharray="5 4"/><text x="185" y="26" text-anchor="middle" dominant-baseline="central" fill="currentColor" style="font-size:15px;font-family:'JetBrains Mono','IBM Plex Mono',ui-monospace,monospace;paint-order:stroke;stroke:var(--paper);stroke-width:5px;stroke-linejoin:round;">x</text><text x="185" y="146" text-anchor="middle" dominant-baseline="central" fill="currentColor" style="font-size:15px;font-family:'JetBrains Mono','IBM Plex Mono',ui-monospace,monospace;paint-order:stroke;stroke:var(--paper);stroke-width:5px;stroke-linejoin:round;">y</text><path d="M321,85 L494,85" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ARR)" stroke-dasharray="5 4"/><text x="408" y="72" text-anchor="middle" dominant-baseline="central" fill="currentColor" style="font-size:15px;font-family:'JetBrains Mono','IBM Plex Mono',ui-monospace,monospace;paint-order:stroke;stroke:var(--paper);stroke-width:5px;stroke-linejoin:round;">z</text><text x="300" y="128" text-anchor="middle" dominant-baseline="central" fill="var(--hi)" style="font-size:12px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;">same state</text></svg><figcaption><strong>Why a distinguishing suffix forces two states.</strong> If <i>x</i> and <i>y</i> led to the same state <i>q</i>, then <i>xz</i> and <i>yz</i> would end in the same state <i>r</i>, so the DFA would accept both or neither. A suffix <i>z</i> with exactly one of <i>xz</i>, <i>yz</i> in <i>L</i> rules that out.</figcaption></figure>
