ill="currentColor" style="font-size:14px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;">ones<tspan dy="4" style="font-size:10px">2</tspan></text><rect x="547" y="69" width="66" height="46" rx="23" fill="var(--paper)" stroke="currentColor" stroke-width="1.6"/><rect x="551" y="73" width="58" height="38" rx="19" fill="var(--accent)" fill-opacity="0.1" stroke="currentColor" stroke-width="1.6"/><text x="580" y="93" text-anchor="middle" dominant-baseline="central" fill="currentColor" style="font-size:14px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;">zeros<tspan dy="4" style="font-size:10px">2</tspan></text><rect x="554" y="177" width="52" height="38" rx="19" fill="var(--paper)" stroke="currentColor" stroke-width="1.6"/><text x="580" y="197" text-anchor="middle" dominant-baseline="central" fill="currentColor" style="font-size:14px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;">dead</text></svg><figcaption><strong>Exactly two occurrences of 01.</strong> The subscript counts the occurrences of 01 read so far; <i>ones</i> means the input so far is empty or ends in 1, <i>zeros</i> that it ends in 0. A 0 moves from <i>ones</i> to <i>zeros</i>, and a 1 after a 0 completes one more 01. The accepting states are the two with subscript 2; a third 01 leads to the dump state <i>dead</i>.</figcaption></figure>
