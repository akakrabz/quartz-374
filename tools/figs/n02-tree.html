gcaption><strong>The recursion tree of one run on 7 pairs (the note has only a placeholder here).</strong> Each box is a subproblem, listing the ranks of its bolts; the circled rank is its pivot bolt, which is compared with every nut in the box, and then its nut with every other bolt: 2<i>m</i> − 1 tests for <i>m</i> pairs. Any order that partitions a box after its parent gives the same tests — here the pivots were drawn in the order 3, 6, 1, 5, 2, 7, 4. Bolt 2 and nut 5 are never compared: the first pivot drawn from {2, 3, 4, 5} is 3, which separates them. Bolt 4 and nut 5 are: the first pivot drawn from {4, 5} is 5. This run uses 29 tests; the expectation for 7 pairs is about 33.97.</figcaption></figure>
