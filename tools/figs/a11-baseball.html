text></svg><figcaption><strong>The baseball-elimination network for Detroit, August 30, 1996 (the book’s Figure 11.7).</strong> One vertex per pair of rivals with games left (Boston and Toronto have none) and one per rival team. An edge from <i>s</i> carries the number of games the pair still plays; the unlabeled edges have infinite capacity; the edge from a team to <i>t</i> allows 76 minus its current wins, 76 = 49 + 27 being Detroit’s best possible total. The four highlighted edges form a cut of capacity 26 &lt; 27, so no flow saturates every edge out of <i>s</i>: Detroit is eliminated.</figcaption></figure>
