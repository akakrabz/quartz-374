36;:   120 · 0.01 · 1.2 = 1.44,    −4.79 + 4.61 − 0.18 = −0.36 &lt; 0</text></svg><figcaption><strong>The currency graph.</strong> One vertex per currency and an edge <i>i</i>→<i>j</i> for every rate; each edge shows the rate <i>R</i>[<i>i</i>, <i>j</i>] and, in parentheses, its weight −ln <i>R</i>[<i>i</i>, <i>j</i>]. A sequence of trades multiplies the money by the product of the rates, which is <i>e</i> to the minus length of the walk: more money is a shorter walk, and the handout’s arbitrage cycle (blue, product 1.44) is a cycle of negative length. Every other cycle has product at most 1: 0.96 for &#36;⇄¥ and &#36;⇄€, exactly 1 for ¥⇄€ (length 0, not arbitrage), 0.64 for &#36; → € → ¥ → &#36;. The rates other than the handout’s three are made up; they need not be reciprocal.</figcaption></figure>
