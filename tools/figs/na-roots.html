square</text><path d="M284,62 Q333.0,30 382,62" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ARR)"/><text x="333" y="30" text-anchor="middle" dominant-baseline="central" fill="var(--muted)" style="font-size:12.5px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;paint-order:stroke;stroke:var(--paper);stroke-width:5px;stroke-linejoin:round;">square</text><path d="M450,62 Q491.0,30 532,62" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ARR)"/><text x="491" y="30" text-anchor="middle" dominant-baseline="central" fill="var(--muted)" style="font-size:12.5px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;paint-order:stroke;stroke:var(--paper);stroke-width:5px;stroke-linejoin:round;">square</text></svg><figcaption><strong>The roots of unity are a collapsing set.</strong> Left: the eighth roots of unity ω<sup>k</sup> = <i>e</i><sup>2π<i>ik</i>/8</sup>. Opposite points (joined by dashed diameters, same color) are <i>x</i> and −<i>x</i>, so they have the same square: squaring maps the 8 points two-to-one onto the 4 fourth roots (each drawn in the color of the pair it comes from), those onto the 2 square roots of 1, and those onto {1}. This is why each level of the radix-2 FFT needs only half as many sample points.</figcaption></figure>
