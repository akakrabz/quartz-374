<figure class="cs-fig"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 236" width="520" height="236" role="img" style="font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;font-size:14px"><title>two parallel lines with two solid parallel segments and two dashed crossing segments meeting at x</title><defs><marker id="ARR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs><line x1="30" y1="40" x2="490" y2="40" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><line x1="30" y1="170" x2="490" y2="170" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><text x="500" y="40" text-anchor="start" dominant-baseline="central" fill="currentColor" style="font-size:16px;font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif;font-style:italic;">ℓ</text><text x="500" y="170" text-anchor="start" dominant-baseline="central" fill="currentColor" style="font-size:16px;font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif;font-style:italic;">ℓ′</text><line x1="110" y1="40" x2="170" y2="170" stroke="var(--accent)" stroke-width="2.2" stroke-linecap="round"/><line x1="330" y1="40" x2="420" y2="170" stroke="var(--accent)" stroke-width="2.2" stroke-linecap="round"/><line x1="110" y1="40" x2="420" y2="170" stroke="var(--hi)" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="6 4"/><line x1="330" y1="40" x2="170" y2="170" stroke="var(--hi)" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="6 4"/><circle cx="255.1" cy="100.9" r="3.5" fill="currentColor" stroke="currentColor" stroke-width="1.6"/><text x="269.1" y="101.9" text-anchor="middle" dominant-baseline="central" fill="currentColor" style="font-size:16px;font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif;font-style:italic;paint-order:stroke;stroke:var(--paper);stroke-width:5px;stroke-linejoin:round;">x</text><circle cx="110" cy="40" r="4.5" fill="var(--paper)" stroke="currentColor" stroke-width="1.6"/><text x="107" y="22" text-anchor="middle" dominant-baseline="central" fill="currentColor" style="font-size:17px;font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif;font-style:italic;">p</text><text x="114" y="28" text-anchor="start" dominant-baseline="central" fill="currentColor" style="font-size:12px;font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif;font-style:italic;">i</text><circle cx="330" cy="40" r="4.5" fill="var(--paper)" stroke="currentColor" stroke-width="1.6"/><text x="327" y="22" text-anchor="middle" dominant-baseline="central" fill="currentColor" style="font-size:17px;font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif;font-style:italic;">p</text><text x="334" y="28" text-anchor="start" dominant-baseline="central" fill="currentColor" style="font-size:12px;font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif;font-style:italic;">i′</text><circle cx="170" cy="170" r="4.5" fill="var(--paper)" stroke="currentColor" stroke-width="1.6"/><text x="167" y="190" text-anchor="middle" dominant-baseline="central" fill="currentColor" style="font-size:17px;font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif;font-style:italic;">q</text><text x="174" y="196" text-anchor="start" dominant-baseline="central" fill="currentColor" style="font-size:12px;font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif;font-style:italic;">j</text><circle cx="420" cy="170" r="4.5" fill="var(--paper)" stroke="currentColor" stroke-width="1.6"/><text x="417" y="190" text-anchor="middle" dominant-baseline="central" fill="currentColor" style="font-size:17px;font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif;font-style:italic;">q</text><text x="424" y="196" text-anchor="start" dominant-baseline="central" fill="currentColor" style="font-size:12px;font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif;font-style:italic;">j′</text><text x="260" y="222" text-anchor="middle" dominant-baseline="central" fill="var(--muted)" style="font-size:12px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;">solid: M[i, j] + M[i′, j′]   ·   dashed: M[i, j′] + M[i′, j]</text></svg><figcaption><strong>Why distances between two parallel lines are Monge.</strong> With <i>i</i> &lt; <i>i</i>′ and <i>j</i> &lt; <i>j</i>′ (points numbered in the same direction on both lines), the crossing segments <i>p<sub>i</sub>q<sub>j′</sub></i> and <i>p<sub>i′</sub>q<sub>j</sub></i> (dashed) meet at a point <i>x</i>. Splitting them at <i>x</i> and regrouping the four pieces gives two paths from <i>p<sub>i</sub></i> to <i>q<sub>j</sub></i> and from <i>p<sub>i′</sub></i> to <i>q<sub>j′</sub></i>, which by the triangle inequality are at least as long as the solid segments: the non-crossing pairs never cost more than the crossing pairs.</figcaption></figure>
