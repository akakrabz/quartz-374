<figure class="cs-fig"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 226" width="640" height="226" role="img" style="font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;font-size:14px"><title>vertices x, u, v, y: the old path from x to y, and the path through the lightened edge u to v</title><defs><marker id="ARR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs><path d="M156.0,167.9 Q330.0,232.0 501.7,168.7" fill="none" stroke="var(--muted)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ARR)" stroke-dasharray="5 4"/><text x="330" y="210" text-anchor="middle" dominant-baseline="central" fill="var(--muted)" style="font-size:13px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;paint-order:stroke;stroke:var(--paper);stroke-width:5px;stroke-linejoin:round;">old shortest path:  dist[<tspan font-style='italic'>x</tspan>, <tspan font-style='italic'>y</tspan>]</text><path d="M149.1,147.6 Q183.6,92.9 241.8,70.9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ARR)" stroke-dasharray="5 4"/><text x="152" y="94" text-anchor="end" dominant-baseline="central" fill="currentColor" style="font-size:13.5px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;paint-order:stroke;stroke:var(--paper);stroke-width:5px;stroke-linejoin:round;">dist[<tspan font-style='italic'>x</tspan>, <tspan font-style='italic'>u</tspan>]</text><text x="152" y="112" text-anchor="end" dominant-baseline="central" fill="var(--muted)" style="font-size:12px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;">column <tspan font-style='italic'>u</tspan>: unchanged</text><path d="M277,64 L380.5,64" fill="none" stroke="var(--accent)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ARR)"/><text x="330" y="30" text-anchor="middle" dominant-baseline="central" fill="var(--accent)" style="font-size:13.5px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;paint-order:stroke;stroke:var(--paper);stroke-width:5px;stroke-linejoin:round;"><tspan font-style='italic'>w</tspan>′(<tspan font-style='italic'>u</tspan>→<tspan font-style='italic'>v</tspan>) — now lighter</text><path d="M415.9,70.0 Q476.4,92.9 509.6,145.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ARR)" stroke-dasharray="5 4"/><text x="508" y="94" text-anchor="start" dominant-baseline="central" fill="currentColor" style="font-size:13.5px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;paint-order:stroke;stroke:var(--paper);stroke-width:5px;stroke-linejoin:round;">dist[<tspan font-style='italic'>v</tspan>, <tspan font-style='italic'>y</tspan>]</text><text x="508" y="112" text-anchor="start" dominant-baseline="central" fill="var(--muted)" style="font-size:12px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;">row <tspan font-style='italic'>v</tspan>: unchanged</text><circle cx="140" cy="162" r="17" fill="var(--paper)" stroke="currentColor" stroke-width="1.6"/><text x="140" y="163" text-anchor="middle" dominant-baseline="central" fill="currentColor" style="font-size:16px;font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif;font-style:italic;">x</text><circle cx="260" cy="64" r="17" fill="var(--paper)" stroke="currentColor" stroke-width="1.6"/><circle cx="260" cy="64" r="17" fill="var(--accent)" fill-opacity="0.16" stroke="currentColor" stroke-width="1.6"/><text x="260" y="65" text-anchor="middle" dominant-baseline="central" fill="currentColor" style="font-size:16px;font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif;font-style:italic;">u</text><circle cx="400" cy="64" r="17" fill="var(--paper)" stroke="currentColor" stroke-width="1.6"/><circle cx="400" cy="64" r="17" fill="var(--accent)" fill-opacity="0.16" stroke="currentColor" stroke-width="1.6"/><text x="400" y="65" text-anchor="middle" dominant-baseline="central" fill="currentColor" style="font-size:16px;font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif;font-style:italic;">v</text><circle cx="520" cy="162" r="17" fill="var(--paper)" stroke="currentColor" stroke-width="1.6"/><text x="520" y="163" text-anchor="middle" dominant-baseline="central" fill="currentColor" style="font-size:16px;font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif;font-style:italic;">y</text></svg><figcaption><strong>Repairing after a weight decrease.</strong> A new shortest path from <i>x</i> to <i>y</i> either avoids <i>u</i>→<i>v</i> — then it is no shorter than the old one, dist[<i>x</i>, <i>y</i>] (gray) — or uses it exactly once, after a shortest path to <i>u</i> and before a shortest path from <i>v</i>. Those two pieces never use <i>u</i>→<i>v</i> (a simple path that ends at <i>u</i> or starts at <i>v</i> cannot), so the old entries dist[<i>x</i>, <i>u</i>] and dist[<i>v</i>, <i>y</i>] are still exact: the new distance is the smaller of dist[<i>x</i>, <i>y</i>] and dist[<i>x</i>, <i>u</i>] + <i>w</i>′(<i>u</i>→<i>v</i>) + dist[<i>v</i>, <i>y</i>].</figcaption></figure>
