n><strong>3Sat → MaxIndSet</strong> (the book's Figure 12.8, recomputed) for Φ = (<i>a</i> ∨ <i>b</i> ∨ <i>c</i>) ∧ (<i>b</i> ∨ <i>c̄</i> ∨ <i>d̄</i>) ∧ (<i>ā</i> ∨ <i>c</i> ∨ <i>d</i>) ∧ (<i>a</i> ∨ <i>b̄</i> ∨ <i>d̄</i>). One triangle per clause (black edges), and a red edge between every pair of contradictory literals — 12 vertices, 12 + 8 edges. The four circled vertices form an independent set of size 4 = number of clauses; making their literals true gives <i>a</i> = <i>c</i> = True, <i>d</i> = False, which satisfies Φ for either value of <i>b</i>.</figcaption></figure>
