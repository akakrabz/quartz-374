<figure class="cs-fig"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 240" width="440" height="240" role="img" style="font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;font-size:14px"><title>graph on six vertices with a forest Y of two edges and a forest X of three edges</title><defs><marker id="ARR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs><path d="M70,86 L70,166.5" fill="none" stroke="var(--muted)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/><path d="M85.9,186.6 L201.6,198.2" fill="none" stroke="var(--muted)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/><path d="M235.9,198.4 L351.6,186.8" fill="none" stroke="var(--muted)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/><path d="M85.6,66.4 L202,39.2" fill="none" stroke="var(--accent2)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M235.6,38.6 L352,65.8" fill="none" stroke="var(--accent2)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M220,51 L220,181.5" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M370,86 L370,166.5" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M86,70 L351.5,70" fill="none" stroke="var(--hi)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5"/><circle cx="70" cy="70" r="16" fill="var(--paper)" stroke="currentColor" stroke-width="1.6"/><text x="70" y="71" text-anchor="middle" dominant-baseline="central" fill="currentColor" style="font-size:15px;font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif;font-style:italic;">p</text><circle cx="220" cy="35" r="16" fill="var(--paper)" stroke="currentColor" stroke-width="1.6"/><text x="220" y="36" text-anchor="middle" dominant-baseline="central" fill="currentColor" style="font-size:15px;font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif;font-style:italic;">q</text><circle cx="370" cy="70" r="16" fill="var(--paper)" stroke="currentColor" stroke-width="1.6"/><text x="370" y="71" text-anchor="middle" dominant-baseline="central" fill="currentColor" style="font-size:15px;font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif;font-style:italic;">r</text><circle cx="70" cy="185" r="16" fill="var(--paper)" stroke="currentColor" stroke-width="1.6"/><text x="70" y="186" text-anchor="middle" dominant-baseline="central" fill="currentColor" style="font-size:15px;font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif;font-style:italic;">u</text><circle cx="220" cy="200" r="16" fill="var(--paper)" stroke="currentColor" stroke-width="1.6"/><text x="220" y="201" text-anchor="middle" dominant-baseline="central" fill="currentColor" style="font-size:15px;font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif;font-style:italic;">v</text><circle cx="370" cy="185" r="16" fill="var(--paper)" stroke="currentColor" stroke-width="1.6"/><text x="370" y="186" text-anchor="middle" dominant-baseline="central" fill="currentColor" style="font-size:15px;font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif;font-style:italic;">w</text><text x="140" y="40" text-anchor="middle" dominant-baseline="central" fill="var(--accent2)" style="font-size:15px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;font-weight:700;paint-order:stroke;stroke:var(--paper);stroke-width:5px;stroke-linejoin:round;">Y</text><text x="300" y="86" text-anchor="middle" dominant-baseline="central" fill="var(--hi)" style="font-size:13px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;paint-order:stroke;stroke:var(--paper);stroke-width:5px;stroke-linejoin:round;">pr</text><text x="232" y="120" text-anchor="middle" dominant-baseline="central" fill="var(--accent)" style="font-size:13px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;paint-order:stroke;stroke:var(--paper);stroke-width:5px;stroke-linejoin:round;">qv</text><text x="392" y="128" text-anchor="middle" dominant-baseline="central" fill="var(--accent)" style="font-size:13px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;paint-order:stroke;stroke:var(--paper);stroke-width:5px;stroke-linejoin:round;">rw</text></svg><figcaption><strong>The exchange property in a graphic matroid.</strong> <i>Y</i> = {<i>pq</i>, <i>qr</i>} (thick, two edges) and <i>X</i> = {<i>pr</i>, <i>qv</i>, <i>rw</i>} (three edges) are forests, so both are independent in <i>M</i>(<i>G</i>); dashed grey edges are the rest of the graph. Adding <i>pr</i> to <i>Y</i> closes the cycle <i>p q r</i>, but <i>qv</i> and <i>rw</i> each join two different trees of <i>Y</i>, so <i>Y</i> + <i>qv</i> and <i>Y</i> + <i>rw</i> are forests. Some edge of <i>X</i> always works: a forest with more edges has fewer trees, so its edges cannot all stay inside the trees of <i>Y</i>.</figcaption></figure>
