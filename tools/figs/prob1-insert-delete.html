ntColor" stroke-width="1.6"/><text x="425" y="233" text-anchor="middle" dominant-baseline="central" fill="currentColor" style="font-size:14px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;">E,1</text><circle cx="565" cy="232" r="25" fill="var(--paper)" stroke="currentColor" stroke-width="1.6"/><circle cx="565" cy="232" r="21" fill="var(--accent)" fill-opacity="0.1" stroke="currentColor" stroke-width="1.6"/><text x="565" y="233" text-anchor="middle" dominant-baseline="central" fill="currentColor" style="font-size:14px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;">O,1</text></svg><figcaption><strong>Two copies of <i>M</i>, one guess.</strong> Here <i>M</i> accepts the strings with an odd number of 1s (E/O: even/odd so far). Top row: phase 0, the extra 1 has not been handled yet; bottom row: phase 1, it has. Left: reading a 1 may drop to phase 1 <em>without moving M</em> — that 1 is the inserted one. Right: an ε-move drops to phase 1 while <em>M reads a 1 that is not in the input</em> (so E,0 drops to O,1). Only (O, 1) accepts. The left machine accepts an even, positive number of 1s; the right one an even number of 1s.</figcaption></figure>
