imes New Roman',serif;font-style:italic;">ε</text><text x="238" y="91" text-anchor="start" dominant-baseline="central" fill="var(--hi)" style="font-size:12px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;">one new pair per symbol of w</text><path d="M282,166 L282,172 L560,172 L560,166" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><text x="421" y="187" text-anchor="middle" dominant-baseline="central" fill="currentColor" style="font-size:12px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;">z = HERE, reused unchanged</text></svg><figcaption><strong>Concatenation recurses on its left argument.</strong> Computing NOW • HERE peels N, O, W off the left argument one at a time and rebuilds a pair for each (red); when the left argument has shrunk to ε, the base case returns <i>z</i> = HERE as it is. The right argument is never taken apart, so induction on <i>w</i> is the natural way to prove things about <i>w</i> • <i>z</i>.</figcaption></figure>
