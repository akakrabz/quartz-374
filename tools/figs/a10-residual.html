 Pro',system-ui,sans-serif;paint-order:stroke;stroke:var(--paper);stroke-width:5px;stroke-linejoin:round;">5</text></svg><figcaption><strong>The residual graph of that flow, and an augmenting path (the book’s Figures 10.5 and 10.6).</strong> An edge <i>u</i>→<i>v</i> with flow <i>f</i> and capacity <i>c</i> gives a forward residual edge of capacity <i>c</i> − <i>f</i> (if positive) and a backward one, <i>v</i>→<i>u</i>, of capacity <i>f</i> (if positive). The path <i>s</i>→<i>c</i>→<i>a</i>→<i>b</i>→<i>d</i>→<i>t</i> has residual capacities 10, 10, 5, 5, 15, so it can carry <i>F</i> = 5 more units; two of its edges, <i>c</i>→<i>a</i> and <i>b</i>→<i>d</i>, are backward edges, so augmenting along it <em>removes</em> 5 units from <i>a</i>→<i>c</i> and from <i>d</i>→<i>b</i>.</figcaption></figure>
