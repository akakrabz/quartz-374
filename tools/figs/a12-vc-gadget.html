olor" style="font-size:14px;font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif;font-style:italic;">u</text><text x="622" y="30" text-anchor="middle" dominant-baseline="central" fill="currentColor" style="font-size:14px;font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif;font-style:italic;">v</text><line x1="512" y1="26" x2="512" y2="226" stroke="var(--muted)" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 4"/><text x="60" y="240" text-anchor="middle" dominant-baseline="central" fill="var(--muted)" style="font-size:11.5px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;">u&#x27;s chain ↑</text><text x="190" y="240" text-anchor="middle" dominant-baseline="central" fill="var(--muted)" style="font-size:11.5px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;">v&#x27;s chain ↑</text></svg><figcaption><strong>The edge gadget for an edge <i>uv</i></strong> (the book's Figure 12.16): four vertices, six directed edges. The left column lies on <i>u</i>'s vertex chain, the right column on <i>v</i>'s (chains run upward; the stubs are the chain edges in and out). A Hamiltonian cycle can cross the gadget in only three ways: straight up both columns, or along one chain with a detour through the other column — which leaves the other chain's stubs unused. The vertex whose chain is used is in the cover; a detour means the other endpoint is not.</figcaption></figure>
