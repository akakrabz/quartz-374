t-baseline="central" fill="var(--muted)" style="font-size:13px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;paint-order:stroke;stroke:var(--paper);stroke-width:5px;stroke-linejoin:round;">0</text><text x="404" y="140" text-anchor="middle" dominant-baseline="central" fill="var(--muted)" style="font-size:13px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;paint-order:stroke;stroke:var(--paper);stroke-width:5px;stroke-linejoin:round;">0</text><path d="M290,129 L290,160.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ARR)"/><text x="302" y="146" text-anchor="start" dominant-baseline="central" fill="currentColor" style="font-size:13px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;paint-order:stroke;stroke:var(--paper);stroke-width:5px;stroke-linejoin:round;">2</text><path d="M297.2,195.4 Q306.0,214.0 298.3,230.4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ARR)"/><path d="M282.8,232.6 Q274.0,214.0 281.7,197.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ARR)"/><text x="311.9" y="213.4" text-anchor="start" dominant-baseline="central" fill="currentColor" style="font-size:13px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;paint-order:stroke;stroke:var(--paper);stroke-width:5px;stroke-linejoin:round;">1</text><text x="268.1" y="214.6" text-anchor="end" dominant-baseline="central" fill="currentColor" style="font-size:13px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;paint-order:stroke;stroke:var(--paper);stroke-width:5px;stroke-linejoin:round;">3</text><path d="M120.5,162.6 Q290.0,-54.0 458.0,160.6" fill="none" stroke="var(--accent)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ARR)"/><text x="289.6" y="39.8" text-anchor="middle" dominant-baseline="central" fill="var(--accent)" style="font-size:13.5px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;paint-order:stroke;stroke:var(--paper);stroke-width:5px;stroke-linejoin:round;"><tspan font-style='italic'>w</tspan>(<tspan font-style='italic'>u</tspan>→<tspan font-style='italic'>v</tspan>) = 0,   <tspan font-style='italic'>w</tspan>′(<tspan font-style='italic'>u</tspan>→<tspan font-style='italic'>v</tspan>) = <tspan font-style='italic'>M</tspan> = 7</text><circle cx="110" cy="176" r="17" fill="var(--paper)" stroke="currentColor" stroke-width="1.6"/><circle cx="110" cy="176" r="17" fill="var(--accent)" fill-opacity="0.16" stroke="currentColor" stroke-width="1.6"/><text x="110" y="177" text-anchor="middle" dominant-baseline="central" fill="currentColor" style="font-size:16px;font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif;font-style:italic;">u</text><circle cx="470" cy="176" r="17" fill="var(--paper)" stroke="currentColor" stroke-width="1.6"/><circle cx="470" cy="176" r="17" fill="var(--accent)" fill-opacity="0.16" stroke="currentColor" stroke-width="1.6"/><text x="470" y="177" text-anchor="middle" dominant-baseline="central" fill="currentColor" style="font-size:16px;font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif;font-style:italic;">v</text><circle cx="290" cy="112" r="17" fill="var(--paper)" stroke="currentColor" stroke-width="1.6"/><text x="290" y="113" text-anchor="middle" dominant-baseline="central" fill="currentColor" style="font-size:16px;font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif;font-style:italic;">p</text><circle cx="290" cy="180" r="17" fill="var(--paper)" stroke="currentColor" stroke-width="1.6"/><text x="290" y="181" text-anchor="middle" dominant-baseline="central" fill="currentColor" style="font-size:16px;font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif;font-style:italic;">q</text><circle cx="290" cy="248" r="17" fill="var(--paper)" stroke="currentColor" stroke-width="1.6"/><text x="290" y="249" text-anchor="middle" dominant-baseline="central" fill="currentColor" style="font-size:16px;font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif;font-style:italic;">r</text><text x="110" y="210" text-anchor="middle" dominant-baseline="central" fill="var(--muted)" style="font-size:12px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;">every vertex → <tspan font-style='italic'>u</tspan></text><text x="470" y="210" text-anchor="middle" dominant-baseline="central" fill="var(--muted)" style="font-size:12px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;"><tspan font-style='italic'>v</tspan> → every vertex</text></svg><figcaption><strong>Repairing after an increase is as hard as computing all distances.</strong> Take any graph <i>H</i> with nonnegative weights (here <i>p</i>→<i>q</i>, <i>q</i>→<i>r</i>, <i>r</i>→<i>q</i>), add <i>u</i> with a 0-weight edge from every vertex of <i>H</i>, <i>v</i> with a 0-weight edge to every vertex of <i>H</i>, and the edge <i>u</i>→<i>v</i>. With <i>w</i>(<i>u</i>→<i>v</i>) = 0 every distance is 0, so the old array is all zeros whatever <i>H</i> is. With <i>w</i>′(<i>u</i>→<i>v</i>) = <i>M</i>, 1 more than the total weight of <i>H</i>, the corrected distance between vertices of <i>H</i> is min{dist<sub><i>H</i></sub>, <i>M</i>}: here 2, 3, 1, 3 from <i>p</i> to <i>q</i>, <i>p</i> to <i>r</i>, <i>q</i> to <i>r</i>, <i>r</i> to <i>q</i>, and <i>M</i> = 7, meaning “unreachable in <i>H</i>”, from <i>q</i> or <i>r</i> to <i>p</i>.</figcaption></figure>
