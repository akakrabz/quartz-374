text><text x="439.7" y="41.1" text-anchor="middle" dominant-baseline="central" fill="currentColor" style="font-size:13px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;paint-order:stroke;stroke:var(--paper);stroke-width:5px;stroke-linejoin:round;">X−1</text><text x="410.3" y="78.9" text-anchor="middle" dominant-baseline="central" fill="currentColor" style="font-size:13px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;paint-order:stroke;stroke:var(--paper);stroke-width:5px;stroke-linejoin:round;">1</text><text x="431.8" y="138.7" text-anchor="middle" dominant-baseline="central" fill="var(--hi)" style="font-size:13px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;paint-order:stroke;stroke:var(--paper);stroke-width:5px;stroke-linejoin:round;">X</text></svg><figcaption><strong>Edmonds and Karp’s bad example for Ford–Fulkerson (the book’s Figure 10.7).</strong> Left: the network, with a large integer <i>X</i>; its maximum flow is 2<i>X</i>. If the first augmenting path is <i>s</i>→<i>u</i>→<i>v</i>→<i>t</i>, it carries only 1 unit (the middle edge). Right: the residual graph then contains the backward edge <i>v</i>→<i>u</i>, and the path <i>s</i>→<i>v</i>→<i>u</i>→<i>t</i> again carries 1 unit, cancelling the flow on <i>u</i>→<i>v</i>. Alternating the two paths, Ford–Fulkerson makes 2<i>X</i> augmentations; choosing <i>s</i>→<i>u</i>→<i>t</i> and <i>s</i>→<i>v</i>→<i>t</i> instead takes 2.</figcaption></figure>
