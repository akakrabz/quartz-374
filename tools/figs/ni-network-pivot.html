a</i>→<i>c</i> 5, <i>b</i>→<i>c</i> 1, <i>b</i>→<i>d</i> 4, <i>c</i>→<i>d</i> 2. Solid edges form the spanning tree <i>T</i> and carry flow<sub><i>T</i></sub> (the total balance on the head side); dashed edges are free of flow and carry slack<sub><i>T</i></sub> (the cost of their fundamental cycle). Each pivot brings in a negative-slack edge (red) and pushes flow around its cycle until a backward tree edge (green) empties: the cost drops by flow · |slack|, 21 − 1·2 = 19, then 19 − 2·1 = 17. With every slack ≥ 0 and every flow ≥ 0 the tree is optimal.</figcaption></figure>
