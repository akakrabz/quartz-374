<figure class="cs-fig"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" width="640" height="200" role="img" style="font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;font-size:14px"><title>block diagram: an instance x of X enters a reduction box that outputs an instance y of Y, which goes into a black box for Y whose yes or no answer is the answer for x</title><defs><marker id="ARR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs><rect x="92" y="22" width="410" height="150" rx="10" fill="none" stroke="currentColor" stroke-width="1.4" stroke-dasharray="5 4"/><text x="297" y="38" text-anchor="middle" dominant-baseline="central" fill="var(--muted)" style="font-size:13px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;font-weight:600;">an algorithm for X</text><rect x="112" y="62" width="150" height="76" rx="8" fill="var(--accent)" fill-opacity="0.08" stroke="var(--accent)" stroke-width="1.8"/><text x="187" y="86" text-anchor="middle" dominant-baseline="central" fill="var(--accent)" style="font-size:14px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;font-weight:600;">reduction</text><text x="187" y="106" text-anchor="middle" dominant-baseline="central" fill="currentColor" style="font-size:13px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;">build y from x</text><text x="187" y="124" text-anchor="middle" dominant-baseline="central" fill="currentColor" style="font-size:13px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;">in polynomial time</text><rect x="338" y="62" width="120" height="76" rx="8" fill="var(--muted)" fill-opacity="0.1" stroke="currentColor" stroke-width="1.6"/><text x="398" y="90" text-anchor="middle" dominant-baseline="central" fill="currentColor" style="font-size:14px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;font-weight:600;">black box</text><text x="398" y="112" text-anchor="middle" dominant-baseline="central" fill="currentColor" style="font-size:13px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;">for Y</text><text x="398" y="128" text-anchor="middle" dominant-baseline="central" fill="var(--muted)" style="font-size:12px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;">(hypothetical)</text><line x1="20" y1="100" x2="109" y2="100" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ARR)"/><text x="52" y="82" text-anchor="middle" dominant-baseline="central" fill="currentColor" style="font-size:13px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;">instance x</text><text x="52" y="118" text-anchor="middle" dominant-baseline="central" fill="currentColor" style="font-size:13px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;">of X</text><line x1="264" y1="100" x2="335" y2="100" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ARR)"/><text x="300" y="82" text-anchor="middle" dominant-baseline="central" fill="currentColor" style="font-size:13px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;">instance y</text><text x="300" y="118" text-anchor="middle" dominant-baseline="central" fill="currentColor" style="font-size:13px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;">of Y</text><path d="M460,86 L480,86 L480,70 L630,70" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ARR)"/><path d="M460,114 L480,114 L480,130 L630,130" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ARR)"/><text x="568" y="56" text-anchor="middle" dominant-baseline="central" fill="var(--accent)" style="font-size:13px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;font-weight:600;">YES: x is YES</text><text x="568" y="146" text-anchor="middle" dominant-baseline="central" fill="var(--hi)" style="font-size:13px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;font-weight:600;">NO: x is NO</text><text x="297" y="188" text-anchor="middle" dominant-baseline="central" fill="currentColor" style="font-size:12.5px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;">correct: x is YES ⟺ y is YES  ·  fast: |y| is polynomial in |x|</text></svg><figcaption><strong>A polynomial-time reduction from X to Y</strong> (the book draws one for every reduction in the chapter). The reduction turns an arbitrary instance <i>x</i> of the known problem X into an instance <i>y</i> of the new problem Y, and the black box's answer for <i>y</i> is returned unchanged. If Y could be solved in polynomial time, so could X; since X is NP-hard, Y is NP-hard. The arrow of the reduction points <i>from</i> the known problem <i>to</i> the new one.</figcaption></figure>
