e="currentColor" stroke-width="1.3"/><circle cx="520" cy="112" r="5.5" fill="var(--paper)" stroke="currentColor" stroke-width="1.3"/><text x="320" y="192" text-anchor="middle" dominant-baseline="central" fill="currentColor" style="font-size:12.5px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;">greedy: C4, C3, C2, C1 (new elements 16, 8, 4, 2; a row would give 15, 7, 3, 1)  ·  optimum: R1, R2</text></svg><figcaption><strong>Greedy set cover is not an O(log |<i>F</i>|)-approximation.</strong> Thirty elements in blocks of 2, 4, 8, 16, each split between two rows. The family has |<i>F</i>| = 6 sets: the two rows R1, R2 (15 elements each) and the four blocks C1–C4. Greedy takes C4 first (16 new elements, one more than a row), then C3, C2, C1 — four sets — while the two rows cover everything. With <i>k</i> blocks greedy takes <i>k</i> sets against 2, a ratio of <i>k</i>/2 with only <i>k</i> + 2 sets; it is the ground set, of size 2<sup><i>k</i>+1</sup> − 2, that the ratio is logarithmic in.</figcaption></figure>
