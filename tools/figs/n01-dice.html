ells (red value, blue value) has probability 1/36 and shows the total. An event is a set of cells and its probability is its number of cells over 36. The row “red 5” and the column “blue 5” overlap in the cell (5, 5), so they are not disjoint: Pr[red 5 ∨ blue 5] = (6 + 6 − 1)/36 = 11/36. Conditioning on “total 6” keeps only its five outlined cells, one of which has red 5: Pr[red 5 | total 6] = 1/5.</figcaption></figure>
