ext></svg><figcaption><strong>Removing a stay-put move.</strong> A transition δ(<i>p</i>, <i>a</i>) = (<i>q</i>, <i>b</i>, 0) of <i>M</i> becomes a move right into the new state (<i>q</i>, 1), which moves back left without changing the tape, whatever symbol <i>c</i> it reads. Transitions that move ±1 are copied between the states (<i>p</i>, 0) and (<i>q</i>, 0). Each stay-put step of <i>M</i> costs <i>M</i>′ one extra step.</figcaption></figure>
