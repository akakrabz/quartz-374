seline="central" fill="currentColor" style="font-size:15px;font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif;font-style:italic;">b</text></svg><figcaption><strong>Tight incoming edges are not enough.</strong> With the stored labels 0, 0, 1 no edge is tense, and both <i>a</i> and <i>b</i> have a tight incoming edge (red: <i>dist</i>(<i>u</i>) + <i>w</i> = <i>dist</i>(<i>v</i>)). But the two tight edges only form a cycle among themselves; <i>s</i>→<i>a</i> has slack 1, so no tight path leads from <i>s</i> to <i>a</i> or <i>b</i>. The true distances are 0, 1, 2, and the test of Exercise 8.0(a) — every finite label reachable from <i>s</i> along tight edges — rejects the labels.</figcaption></figure>
