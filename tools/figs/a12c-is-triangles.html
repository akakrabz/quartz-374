nt-size:16px;font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif;font-style:italic;">b̄</text><circle cx="318" cy="178" r="20" fill="var(--paper)" stroke="var(--accent)" stroke-width="1.4"/><circle cx="318" cy="178" r="16" fill="var(--accent)" fill-opacity="0.18" stroke="var(--accent)" stroke-width="2.6"/><text x="318" y="179" text-anchor="middle" dominant-baseline="central" fill="currentColor" style="font-size:16px;font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif;font-style:italic;">c</text><circle cx="428" cy="122" r="16" fill="var(--paper)" stroke="currentColor" stroke-width="1.6"/><text x="428" y="123" text-anchor="middle" dominant-baseline="central" fill="currentColor" style="font-size:16px;font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif;font-style:italic;">a</text><circle cx="508" cy="62" r="20" fill="var(--paper)" stroke="var(--accent)" stroke-width="1.4"/><circle cx="508" cy="62" r="16" fill="var(--accent)" fill-opacity="0.18" stroke="var(--accent)" stroke-width="2.6"/><text x="508" y="63" text-anchor="middle" dominant-baseline="central" fill="currentColor" style="font-size:16px;font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif;font-style:italic;">b̄</text><circle cx="508" cy="178" r="16" fill="var(--paper)" stroke="currentColor" stroke-width="1.6"/><text x="508" y="179" text-anchor="middle" dominant-baseline="central" fill="currentColor" style="font-size:16px;font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif;font-style:italic;">c̄</text><text x="120" y="246" text-anchor="middle" dominant-baseline="central" fill="currentColor" style="font-size:14px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;paint-order:stroke;stroke:var(--paper);stroke-width:5px;stroke-linejoin:round;">clause 1: (a ∨ b ∨ c)</text><text x="300" y="246" text-anchor="middle" dominant-baseline="central" fill="currentColor" style="font-size:14px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;paint-order:stroke;stroke:var(--paper);stroke-width:5px;stroke-linejoin:round;">clause 2: (ā ∨ b̄ ∨ c)</text><text x="480" y="246" text-anchor="middle" dominant-baseline="central" fill="currentColor" style="font-size:14px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;paint-order:stroke;stroke:var(--paper);stroke-width:5px;stroke-linejoin:round;">clause 3: (a ∨ b̄ ∨ c̄)</text></svg><figcaption><strong>3SAT → independent set.</strong> The graph for (<i>a</i> ∨ <i>b</i> ∨ <i>c</i>) ∧ (<i>ā</i> ∨ <i>b̄</i> ∨ <i>c</i>) ∧ (<i>a</i> ∨ <i>b̄</i> ∨ <i>c̄</i>): one vertex per literal occurrence, a triangle per clause (solid) and a conflict edge between every <i>x</i> and <i>x̄</i> (dashed), 15 edges in all. The ringed vertices form an independent set of size 3 = number of clauses — one true literal per clause, never both <i>x</i> and <i>x̄</i> — so the assignment <i>a</i> = <i>c</i> = True, <i>b</i> = False satisfies the formula.</figcaption></figure>
