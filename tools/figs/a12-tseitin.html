nant-baseline="central" fill="currentColor" style="font-size:13.5px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;">1</text><text x="250" y="88" text-anchor="start" dominant-baseline="central" fill="currentColor" style="font-size:13.5px;font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif;font-style:italic;"></text><text x="336" y="88" text-anchor="start" dominant-baseline="central" fill="currentColor" style="font-size:13.5px;font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif;font-style:italic;">(¬y ∨ x₁), (¬y ∨ x₂)</text><text x="500" y="88" text-anchor="start" dominant-baseline="central" fill="currentColor" style="font-size:13.5px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;">2 × 2 (new p₁, p₂)</text><text x="250" y="118" text-anchor="start" dominant-baseline="central" fill="currentColor" style="font-size:13.5px;font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif;font-style:italic;">z = ¬y</text><text x="336" y="118" text-anchor="start" dominant-baseline="central" fill="currentColor" style="font-size:13.5px;font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif;font-style:italic;">(z ∨ y), (¬z ∨ ¬y)</text><text x="500" y="118" text-anchor="start" dominant-baseline="central" fill="currentColor" style="font-size:13.5px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;">2 × 2 (new p₃, p₄)</text><text x="250" y="148" text-anchor="start" dominant-baseline="central" fill="currentColor" style="font-size:13.5px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;">output</text><text x="336" y="148" text-anchor="start" dominant-baseline="central" fill="currentColor" style="font-size:13.5px;font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif;font-style:italic;">(z)</text><text x="500" y="148" text-anchor="start" dominant-baseline="central" fill="currentColor" style="font-size:13.5px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;">4 (new p₅, p₆)</text><text x="436" y="176" text-anchor="middle" dominant-baseline="central" fill="var(--accent)" style="font-size:12.5px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;font-weight:600;">6 clauses → 13 clauses with exactly 3 literals</text></svg><figcaption><strong>CircuitSat → 3Sat on a two-gate circuit.</strong> The circuit computes <i>z</i> = ¬(<i>x</i><sub>1</sub> ∧ <i>x</i><sub>2</sub>). Each gate becomes its CNF (stage 3), and each clause with fewer than three literals is padded with new variables <i>p</i><sub>1</sub>, …, <i>p</i><sub>6</sub> (stage 4); the full 13-clause formula Φ<sub>3</sub> is written out below. Φ<sub>3</sub> is satisfiable exactly when the circuit is: 3 of the 4 inputs work, and each extends to 2<sup>6</sup> satisfying assignments, one for each value of the padding variables.</figcaption></figure>
