-linejoin:round;">every edge and every split edge has capacity 1: maximum flow 1</text></svg><figcaption><strong>Edge-disjoint versus vertex-disjoint paths, and vertex splitting.</strong> Top: in <i>G</i> the two colored paths <i>s a m c t</i> and <i>s b m d t</i> share no edge, so <i>G</i> has 2 edge-disjoint paths from <i>s</i> to <i>t</i>; but both pass through <i>m</i>, and every path from <i>s</i> to <i>t</i> does, so <i>G</i> has only 1 vertex-disjoint path. Bottom: the split graph <i>Ḡ</i>, in which every vertex other than <i>s</i> and <i>t</i> becomes a pair <i>v</i><sub>in</sub> → <i>v</i><sub>out</sub> (left and right circle of each dashed box) and every edge <i>u</i>→<i>v</i> becomes <i>u</i><sub>out</sub> → <i>v</i><sub>in</sub>. With capacity 1 everywhere the maximum flow is 1 (thick path); the split edge of <i>m</i> (highlighted) is a minimum cut on its own.</figcaption></figure>
