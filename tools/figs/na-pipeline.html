<figure class="cs-fig"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 262" width="640" height="262" role="img" style="font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;font-size:14px"><title>a commutative square: coefficient vectors on top, sample vectors below, FFT down, pointwise product across, inverse FFT up</title><defs><marker id="ARR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs><rect x="18" y="30" width="236" height="66" rx="8" fill="var(--paper)" stroke="currentColor" stroke-width="1.3"/><text x="28" y="44" text-anchor="start" dominant-baseline="central" fill="var(--muted)" style="font-size:12px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;">coefficients (padded to n = 4)</text><text x="28" y="64" text-anchor="start" dominant-baseline="central" fill="currentColor" style="font-size:13px;font-family:'JetBrains Mono','IBM Plex Mono',ui-monospace,monospace;">p = [1, 2, 0, 0]</text><text x="28" y="82" text-anchor="start" dominant-baseline="central" fill="currentColor" style="font-size:13px;font-family:'JetBrains Mono','IBM Plex Mono',ui-monospace,monospace;">q = [3, 4, 0, 0]</text><rect x="386" y="30" width="236" height="66" rx="8" fill="var(--paper)" stroke="currentColor" stroke-width="1.3"/><text x="396" y="44" text-anchor="start" dominant-baseline="central" fill="var(--muted)" style="font-size:12px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;">coefficients of the product</text><text x="396" y="64" text-anchor="start" dominant-baseline="central" fill="currentColor" style="font-size:13px;font-family:'JetBrains Mono','IBM Plex Mono',ui-monospace,monospace;">r = [3, 10, 8, 0]</text><rect x="18" y="170" width="236" height="66" rx="8" fill="var(--paper)" stroke="currentColor" stroke-width="1.3"/><text x="28" y="184" text-anchor="start" dominant-baseline="central" fill="var(--muted)" style="font-size:12px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;">samples at 1, i, −1, −i</text><text x="28" y="204" text-anchor="start" dominant-baseline="central" fill="currentColor" style="font-size:13px;font-family:'JetBrains Mono','IBM Plex Mono',ui-monospace,monospace;">p* = [3, 1+2i, −1, 1−2i]</text><text x="28" y="222" text-anchor="start" dominant-baseline="central" fill="currentColor" style="font-size:13px;font-family:'JetBrains Mono','IBM Plex Mono',ui-monospace,monospace;">q* = [7, 3+4i, −1, 3−4i]</text><rect x="386" y="170" width="236" height="66" rx="8" fill="var(--paper)" stroke="currentColor" stroke-width="1.3"/><text x="396" y="184" text-anchor="start" dominant-baseline="central" fill="var(--muted)" style="font-size:12px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;">samples of the product</text><text x="396" y="204" text-anchor="start" dominant-baseline="central" fill="currentColor" style="font-size:13px;font-family:'JetBrains Mono','IBM Plex Mono',ui-monospace,monospace;">r* = [21, −5+10i, 1, −5−10i]</text><line x1="262" y1="63" x2="378" y2="63" stroke="var(--muted)" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ARR)" stroke-dasharray="5 4"/><text x="320" y="50" text-anchor="middle" dominant-baseline="central" fill="var(--muted)" style="font-size:12.5px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;">Multiply: Θ(n²)</text><line x1="262" y1="203" x2="378" y2="203" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ARR)"/><text x="320" y="190" text-anchor="middle" dominant-baseline="central" fill="var(--accent)" style="font-size:12.5px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;font-weight:600;">pointwise ×: O(n)</text><line x1="136" y1="102" x2="136" y2="164" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ARR)"/><text x="146" y="133" text-anchor="start" dominant-baseline="central" fill="var(--accent)" style="font-size:12.5px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;font-weight:600;">FFT: O(n log n)</text><line x1="504" y1="164" x2="504" y2="102" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ARR)"/><text x="494" y="133" text-anchor="end" dominant-baseline="central" fill="var(--accent)" style="font-size:12.5px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;font-weight:600;">inverse FFT: O(n log n)</text></svg><figcaption><strong>FFTMultiply on (1 + 2<i>x</i>)(3 + 4<i>x</i>).</strong> The direct route across the top costs Θ(<i>n</i>²). The detour goes down to the sample representation with two FFTs (evaluating at the fourth roots of unity), multiplies the samples one by one, and comes back with one inverse FFT: 3 + 10<i>x</i> + 8<i>x</i>². Length 4 suffices because the product has only 3 coefficients; with fewer samples than coefficients the high terms would wrap around onto the low ones.</figcaption></figure>
