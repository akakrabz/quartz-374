 y="227" text-anchor="start" dominant-baseline="central" fill="var(--muted)" style="font-size:12px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;">output: a uniformly random</text><text x="384" y="243" text-anchor="start" dominant-baseline="central" fill="var(--muted)" style="font-size:12px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;">permutation of A B C D E</text></svg><figcaption><strong>SelectionShuffle on A B C D E.</strong> Iteration <i>i</i> (from <i>n</i> down to 1) swaps <i>A</i>[<i>i</i>] with <i>A</i>[Random(<i>i</i>)], a uniformly random position among the <i>i</i> not yet chosen (the arc marks the swap). The chosen element lands in position <i>i</i> and the shaded suffix grows by one: it is the list <i>R</i> of drawn lots, the prefix is the bag <i>L</i>. These choices (2, 4, 1, 1, 1) produce E C A D B; each of the 5! = 120 choice sequences gives a different permutation.</figcaption></figure>
