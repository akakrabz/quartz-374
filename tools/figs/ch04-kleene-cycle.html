<figure class="cs-fig"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" width="640" height="250" role="img" style="font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;font-size:14px"><title>four boxes in a cycle: regular expression, NFA with epsilon-transitions, NFA, DFA</title><defs><marker id="ARR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs><rect x="30" y="25" width="196" height="42" rx="10" fill="var(--accent)" fill-opacity="0.08" stroke="currentColor" stroke-width="1.5"/><text x="128" y="47" text-anchor="middle" dominant-baseline="central" fill="currentColor" style="font-size:15px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;">regular expression</text><rect x="414" y="25" width="196" height="42" rx="10" fill="var(--accent)" fill-opacity="0.08" stroke="currentColor" stroke-width="1.5"/><text x="512" y="47" text-anchor="middle" dominant-baseline="central" fill="currentColor" style="font-size:15px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;">NFA with ε-transitions</text><rect x="414" y="171" width="196" height="42" rx="10" fill="var(--accent)" fill-opacity="0.08" stroke="currentColor" stroke-width="1.5"/><text x="512" y="193" text-anchor="middle" dominant-baseline="central" fill="currentColor" style="font-size:15px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;">NFA</text><rect x="30" y="171" width="196" height="42" rx="10" fill="var(--accent)" fill-opacity="0.08" stroke="currentColor" stroke-width="1.5"/><text x="128" y="193" text-anchor="middle" dominant-baseline="central" fill="currentColor" style="font-size:15px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;">DFA</text><line x1="228" y1="46" x2="410" y2="46" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ARR)"/><text x="319" y="30" text-anchor="middle" dominant-baseline="central" fill="currentColor" style="font-size:13px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;font-weight:600;">Thompson&#x27;s algorithm</text><text x="319" y="62" text-anchor="middle" dominant-baseline="central" fill="var(--muted)" style="font-size:12px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;">§4.6 · linear size</text><line x1="512" y1="69" x2="512" y2="167" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ARR)"/><text x="500" y="110" text-anchor="end" dominant-baseline="central" fill="currentColor" style="font-size:13px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;font-weight:600;">remove ε-transitions</text><text x="500" y="128" text-anchor="end" dominant-baseline="central" fill="var(--muted)" style="font-size:12px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;">§4.3 · same states</text><line x1="410" y1="192" x2="228" y2="192" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ARR)"/><text x="319" y="176" text-anchor="middle" dominant-baseline="central" fill="currentColor" style="font-size:13px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;font-weight:600;">subset construction</text><text x="319" y="208" text-anchor="middle" dominant-baseline="central" fill="var(--muted)" style="font-size:12px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;">§4.5 · up to 2ⁿ states</text><line x1="128" y1="169" x2="128" y2="71" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ARR)"/><text x="140" y="110" text-anchor="start" dominant-baseline="central" fill="currentColor" style="font-size:13px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;font-weight:600;">state elimination</text><text x="140" y="128" text-anchor="start" dominant-baseline="central" fill="var(--muted)" style="font-size:12px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;">§4.8 · length up to Θ(4ⁿ)</text><text x="320" y="238" text-anchor="middle" dominant-baseline="central" fill="var(--muted)" style="font-size:12px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;">Free in the other direction: a DFA is an NFA, and an NFA is an NFA with ε-transitions.</text></svg><figcaption><strong>Kleene's theorem as a cycle of conversions.</strong> Following the arrows turns any of the four descriptions into any other, so all four describe exactly the regular languages. The grey notes give the size of the result for an input of size <i>n</i>. The subset construction also accepts ε-transitions directly, and state elimination works on any NFA, so the right-hand arrow is optional.</figcaption></figure>
