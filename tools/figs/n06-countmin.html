al" fill="currentColor" style="font-size:14px;font-family:'JetBrains Mono','IBM Plex Mono',ui-monospace,monospace;">b</text><text x="444" y="90" text-anchor="middle" dominant-baseline="central" fill="currentColor" style="font-size:14px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;">2</text><text x="494" y="90" text-anchor="middle" dominant-baseline="central" fill="currentColor" style="font-size:14px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;">2</text><text x="404" y="118" text-anchor="middle" dominant-baseline="central" fill="currentColor" style="font-size:14px;font-family:'JetBrains Mono','IBM Plex Mono',ui-monospace,monospace;">c</text><text x="444" y="118" text-anchor="middle" dominant-baseline="central" fill="currentColor" style="font-size:14px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;">1</text><text x="494" y="118" text-anchor="middle" dominant-baseline="central" fill="currentColor" style="font-size:14px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;">1</text><text x="404" y="146" text-anchor="middle" dominant-baseline="central" fill="var(--hi)" style="font-size:14px;font-family:'JetBrains Mono','IBM Plex Mono',ui-monospace,monospace;">d</text><text x="444" y="146" text-anchor="middle" dominant-baseline="central" fill="var(--hi)" style="font-size:14px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;">1</text><text x="494" y="146" text-anchor="middle" dominant-baseline="central" fill="var(--hi)" style="font-size:14px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;font-weight:700;">2</text><text x="260" y="202" text-anchor="middle" dominant-baseline="central" fill="currentColor" style="font-size:13px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;">estimate(d) = min(3, 5, 2) = 2</text></svg><figcaption><strong>A count-min sketch with <i>d</i> = 3 rows of <i>w</i> = 5 counters</strong> after the stream a b a c a d b a (<i>N</i> = 8). Each arrival adds 1 to one counter per row, the one its row's hash function picks: a → (0, 3, 1), b → (2, 1, 4), c → (3, 1, 0), d → (2, 3, 0). The estimate for an item is the smallest of its <i>d</i> counters. Every counter of d also counts another item (b, a and c respectively), so the estimate for d is 2 although d occurred once; the estimates for a, b and c are exact. An estimate is never too small.</figcaption></figure>
