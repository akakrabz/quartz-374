al" fill="var(--muted)" style="font-size:11px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;">a cell sits above the substring it covers; – means no nonterminal derives it</text></svg><figcaption><strong>The CYK table for <code>(())()</code>.</strong> Grammar: <i>S</i> → ε | <i>AA</i> | <i>LR</i> | <i>LB</i>, <i>A</i> → <i>AA</i> | <i>LR</i> | <i>LB</i>, <i>B</i> → <i>AR</i>, <i>L</i> → <code>(</code>, <i>R</i> → <code>)</code>. The bottom row holds the nonterminals that derive each symbol; a cell for <i>w</i>[<i>i</i> .. <i>j</i>] collects every <i>X</i> with a rule <i>X</i> → <i>YZ</i> and a split <i>i</i> ≤ <i>k</i> &lt; <i>j</i> such that <i>Y</i> is in the cell for <i>w</i>[<i>i</i> .. <i>k</i>] and <i>Z</i> in the cell for <i>w</i>[<i>k</i>+1 .. <i>j</i>]. The top cell contains <i>S</i>, so the string is balanced; the only way in is <i>A A</i> with <code>(())</code> and <code>()</code> (red).</figcaption></figure>
