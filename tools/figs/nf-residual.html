ties are drawn as usual: <i>c</i> − ψ forward, ψ backward. The highlighted path <i>a</i>→<i>b</i>→<i>f</i>→<i>c</i>→<i>e</i> has residual capacities 15, 7, 4, 10, so 4 units can be pushed; its last two edges are backward, so the push lowers ψ(<i>c</i>→<i>f</i>) to 0 and ψ(<i>e</i>→<i>c</i>) to 6.</figcaption></figure>
