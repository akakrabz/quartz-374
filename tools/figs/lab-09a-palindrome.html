><tspan font-style="italic">p</tspan><tspan dy="4" font-size="11">5</tspan></text><text x="300" y="354" text-anchor="middle" dominant-baseline="central" fill="var(--hi)" style="font-size:12px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;">middle move: any length</text><text x="66" y="354" text-anchor="start" dominant-baseline="central" fill="var(--accent)" style="font-size:12px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;">front token →</text><text x="534" y="354" text-anchor="end" dominant-baseline="central" fill="var(--accent2)" style="font-size:12px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;">← back token</text></svg><figcaption><strong>Problem 6: checking a palindrome from both ends.</strong> A solution <i>p</i><sub>0</sub> = (1,1), …, <i>p</i><sub>m</sub> = (<i>n</i>,<i>n</i>) with its move lengths underneath. The front token replays it from the start (blue), the back token backward from the goal (green), one move each per step, and each step must use two moves of equal length. After <i>k</i> steps the tokens are on (<i>p</i><sub><i>k</i></sub>, <i>p</i><sub><i>m</i>−<i>k</i></sub>) — one vertex of the pair graph per dashed arc. With an even number of moves they end on the same square; with an odd number they end one move apart, and that middle move (red) is paired with itself, so its length is free.</figcaption></figure>
