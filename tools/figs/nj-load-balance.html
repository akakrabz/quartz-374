Balance</text></svg><figcaption><strong>Greedy load balancing on three machines.</strong> The jobs 2, 3, 4, 1, 1, 6, 1 (small numbers: the order of assignment) go one by one to the least-loaded machine (lowest index on ties). In input order the busiest machine M2 reaches 9: its last job <i>j</i> (length 6, highlighted) is at most OPT, and the load under it, 3, was the smallest load when <i>j</i> arrived, so it is at most the average 18/3 = 6 ≤ OPT — the two halves of the proof of Theorem J.1. Sorted in decreasing order the same jobs give makespan 6, which is optimal.</figcaption></figure>
