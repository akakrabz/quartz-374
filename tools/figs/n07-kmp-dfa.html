t-baseline="central" fill="currentColor" style="font-size:14px;font-family:'JetBrains Mono','IBM Plex Mono',ui-monospace,monospace;">ABAB</text></svg><figcaption><strong>The same idea as a DFA: strings containing <code>ABAB</code>.</strong> Each state is named by the longest suffix of the input read so far that is a prefix of the pattern; state <i>k</i> is the prefix of length <i>k</i>. A match moves right; a mismatch from <i>k</i> follows failure edges until some state can read the symbol — <i>fail</i> = 0 1 1 2 gives <code>AB</code> −<code>B</code>→ ε and <code>ABA</code> −<code>A</code>→ <code>A</code>. The last state absorbs. The machine has <i>m</i> + 1 = 5 states and is minimal.</figcaption></figure>
