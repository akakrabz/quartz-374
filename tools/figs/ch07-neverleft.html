.0,28 391.0,40" fill="none" stroke="var(--muted)" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ARR)"/><rect x="249" y="73" width="38" height="38" rx="0" fill="none" stroke="var(--hi)" stroke-width="1.6"/><rect x="337" y="73" width="38" height="38" rx="0" fill="none" stroke="var(--hi)" stroke-width="1.6"/><path d="M268.0,122 Q312.0,148 356.0,122" fill="none" stroke="var(--hi)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><text x="312" y="154" text-anchor="middle" dominant-baseline="central" fill="var(--hi)" style="font-size:12px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;">same state, same symbol ⇒ the run repeats forever</text><path d="M73,120 L73,126 L199,126 L199,120" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><text x="136.0" y="140" text-anchor="middle" dominant-baseline="central" fill="currentColor" style="font-size:13px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;"><tspan style="font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif">input </tspan><tspan style="font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif;font-style:italic">w</tspan></text><text x="246" y="14" text-anchor="middle" dominant-baseline="central" fill="var(--muted)" style="font-size:12px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;">states while reading each cell (the head moves right every step)</text></svg><figcaption><strong>Why NeverLeft is decidable.</strong> A machine that never moves left reads each cell once. Past the input it reads only blanks, so each move depends on its state alone. Here the state <i>q</i> repeats on a blank, and from then on the run cycles <i>q</i>, <i>r</i>, <i>q</i>, <i>r</i>, … to the right forever. Among |<i>Q</i>| + 1 blank reads some state must repeat, so a simulation can stop there.</figcaption></figure>
