ors;</text><text x="324" y="384" text-anchor="middle" dominant-baseline="central" fill="var(--muted)" style="font-size:12px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;">rows top down, left to right</text><text x="538" y="368" text-anchor="middle" dominant-baseline="central" fill="var(--muted)" style="font-size:12px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;">left in row, below in column;</text><text x="538" y="384" text-anchor="middle" dominant-baseline="central" fill="var(--muted)" style="font-size:12px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;">diagonals, shortest first</text></svg><figcaption><strong>Dependencies and evaluation orders.</strong> Top: the entry being computed (red) and the entries it reads (blue); gray cells are base cases, blank cells are never used. Bottom: a valid evaluation order — the thick arrow is the outer loop, thin arrows the inner loop. <i>LISbigger</i> (§3.6) only needs column <i>j</i> + 1, so any order within a column works; <i>Edit</i> (§3.7) can go row by row; <i>OptCost</i> (§3.9) reads whole partial rows and columns, so it goes by diagonals (rows bottom-up or columns left-to-right also work).</figcaption></figure>
