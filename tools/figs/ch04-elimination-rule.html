<figure class="cs-fig"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 196" width="600" height="196" role="img" style="font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;font-size:14px"><title>state elimination: p to q labeled X, loop Y at q, q to r labeled Z, p to r labeled W, becomes p to r labeled W + XY*Z</title><defs><marker id="ARR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs><text x="94" y="92" text-anchor="middle" dominant-baseline="central" fill="currentColor" style="font-size:15px;font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif;font-style:italic;paint-order:stroke;stroke:var(--paper);stroke-width:5px;stroke-linejoin:round;">X</text><text x="228" y="92" text-anchor="middle" dominant-baseline="central" fill="currentColor" style="font-size:15px;font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif;font-style:italic;paint-order:stroke;stroke:var(--paper);stroke-width:5px;stroke-linejoin:round;">Z</text><text x="160" y="155" text-anchor="middle" dominant-baseline="central" fill="currentColor" style="font-size:15px;font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif;font-style:italic;paint-order:stroke;stroke:var(--paper);stroke-width:5px;stroke-linejoin:round;">W</text><text x="160" y="12" text-anchor="middle" dominant-baseline="central" fill="currentColor" style="font-size:15px;font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif;font-style:italic;paint-order:stroke;stroke:var(--paper);stroke-width:5px;stroke-linejoin:round;">Y</text><text x="320" y="116" text-anchor="middle" dominant-baseline="central" fill="currentColor" style="font-size:26px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;">⟹</text><text x="471" y="124" text-anchor="middle" dominant-basel ne="central" fill="var(--hi)" style="font-size:15px;font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif;font-style:italic;">q</text><circle cx="268" cy="140" r="19" fill="var(--paper)" stroke="currentColor" stroke-width="1.6"/><text x="268" y="141" text-anchor="middle" dominant-baseline="central" fill="currentColor" style="font-size:15px;font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif;font-style:italic;">r</text><circle cx="382" cy="140" r="19" fill="var(--paper)" stroke="currentColor" stroke-width="1.6"/><text x="382" y="141" text-anchor="middle" dominant-baseline="central" fill="currentColor" style="font-size:15px;font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif;font-style:italic;">p</text><circle cx="560" cy="140" r="19" fill="var(--paper)" stroke="currentColor" stroke-width="1.6"/><text x="560" y="141" text-anchor="middle" dominant-baseline="central" fill="currentColor" style="font-size:15px;font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif;font-style:italic;">r</text></svg><figcaption><strong>Eliminating a state <i>q</i>.</strong> A walk from <i>p</i> to <i>r</i> either avoids <i>q</i> (label <i>W</i>) or enters <i>q</i>, loops there zero or more times, and leaves (<i>XY</i>*<i>Z</i>). The rule is applied to <em>every</em> pair <i>p</i>, <i>r</i> of remaining states, including <i>p</i> = <i>r</i>; a missing edge has label ∅, and a missing loop makes <i>Y</i>* = ∅* = ε.</figcaption></figure>
