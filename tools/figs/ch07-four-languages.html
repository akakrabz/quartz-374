<figure class="cs-fig"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 176" width="640" height="176" role="img" style="font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;font-size:14px"><title>two bars: the inputs of an arbitrary machine split into Accept, Reject and Diverge; the inputs of a decider split into Accept = L and Reject = complement of L</title><defs><marker id="ARR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs><rect x="150" y="40" width="170" height="34" rx="0" fill="var(--accent)" fill-opacity="0.16" stroke="currentColor" stroke-width="1.3"/><rect x="320" y="40" width="140" height="34" rx="0" fill="var(--accent2)" fill-opacity="0.16" stroke="currentColor" stroke-width="1.3"/><rect x="460" y="40" width="160" height="34" rx="0" fill="var(--muted)" fill-opacity="0.16" stroke="currentColor" stroke-width="1.3" stroke-dasharray="5 3"/><text x="235.0" y="57.0" text-anchor="middle" dominant-baseline="central" fill="currentColor" style="font-size:14px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;"><tspan style="font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif">Accept</tspan><tspan style="font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif">(</tspan><tspan style="font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif;font-style:italic">M</tspan><tspan style="font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif">)</tspan></text><text x="390.0" y="57.0" text-anchor="middle" dominant-baseline="central" fill="currentColor" style="font-size:14px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;"><tspan style="font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif">Reject</tspan><tspan style="font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif">(</tspan><tspan style="font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif;font-style:italic">M</tspan><tspan style="font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif">)</tspan></text><text x="540.0" y="57.0" text-anchor="middle" dominant-baseline="central" fill="currentColor" style="font-size:14px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;"><tspan style="font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif">Diverge</tspan><tspan style="font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif">(</tspan><tspan style="font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif;font-style:italic">M</tspan><tspan style="font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif">)</tspan></text><path d="M152,35 L152,29 L458,29 L458,35" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><text x="305.0" y="18" text-anchor="middle" dominant-baseline="central" fill="currentColor" style="font-size:13px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;"><tspan style="font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif">Halt</tspan><tspan style="font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif">(</tspan><tspan style="font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif;font-style:italic">M</tspan><tspan style="font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif">)</tspan></text><text x="136" y="57.0" text-anchor="end" dominant-baseline="central" fill="currentColor" style="font-size:13px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;"><tspan style="font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif">any machine </tspan><tspan style="font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif;font-style:italic">M</tspan></text><rect x="150" y="110" width="250" height="34" rx="0" fill="var(--accent)" fill-opacity="0.16" stroke="currentColor" stroke-width="1.3"/><rect x="400" y="110" width="220" height="34" rx="0" fill="var(--accent2)" fill-opacity="0.16" stroke="currentColor" stroke-width="1.3"/><text x="275.0" y="127.0" text-anchor="middle" dominant-baseline="central" fill="currentColor" style="font-size:14px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;"><tspan style="font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif">Accept</tspan><tspan style="font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif">(</tspan><tspan style="font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif;font-style:italic">M</tspan><tspan style="font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif">)</tspan><tspan style="font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif"> = </tspan><tspan style="font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif;font-style:italic">L</tspan></text><text x="510.0" y="127.0" text-anchor="middle" dominant-baseline="central" fill="currentColor" style="font-size:14px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;"><tspan style="font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif">Reject</tspan><tspan style="font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif">(</tspan><tspan style="font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif;font-style:italic">M</tspan><tspan style="font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif">)</tspan><tspan style="font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif"> = Σ* ∖ </tspan><tspan style="font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif;font-style:italic">L</tspan></text><text x="136" y="127.0" text-anchor="end" dominant-baseline="central" fill="currentColor" style="font-size:13px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;"><tspan style="font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif;font-style:italic">M</tspan><tspan style="font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif"> decides </tspan><tspan style="font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif;font-style:italic">L</tspan></text><text x="385.0" y="162" text-anchor="middle" dominant-baseline="central" fill="var(--muted)" style="font-size:13px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;"><tspan style="font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif">Diverge</tspan><tspan style="font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif">(</tspan><tspan style="font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif;font-style:italic">M</tspan><tspan style="font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif">)</tspan><tspan style="font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif"> = ∅</tspan><tspan style="font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif">: every input gets an answer</tspan></text></svg><figcaption><strong>Where the inputs go.</strong> Every input string lands in exactly one of Accept(<i>M</i>), Reject(<i>M</i>) and Diverge(<i>M</i>); the first two together form Halt(<i>M</i>). A machine that <em>accepts</em> <i>L</i> only has to get the first set right. A machine that <em>decides</em> <i>L</i> has nothing in the third set, so it rejects exactly the strings not in <i>L</i>.</figcaption></figure>
