rif;font-weight:600;">0</text><circle cx="310" cy="92" r="17" fill="var(--paper)" stroke="currentColor" stroke-width="1.6"/><text x="310" y="93" text-anchor="middle" dominant-baseline="central" fill="currentColor" style="font-size:16px;font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif;font-style:italic;">u</text><text x="310" y="26" text-anchor="middle" dominant-baseline="central" fill="currentColor" style="font-size:14px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;font-weight:600;">0</text><text x="310" y="158" text-anchor="middle" dominant-baseline="central" fill="currentColor" style="font-size:14px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;font-weight:600;">0</text><circle cx="440" cy="92" r="17" fill="var(--paper)" stroke="currentColor" stroke-width="1.6"/><text x="440" y="93" text-anchor="middle" dominant-baseline="central" fill="currentColor" style="font-size:16px;font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif;font-style:italic;">v</text><text x="440" y="26" text-anchor="middle" dominant-baseline="central" fill="currentColor" style="font-size:14px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;font-weight:600;">1</text><text x="440" y="158" text-anchor="middle" dominant-baseline="central" fill="var(--hi)" style="font-size:14px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;font-weight:600;">5</text><circle cx="550" cy="92" r="17" fill="var(--paper)" stroke="currentColor" stroke-width="1.6"/><text x="550" y="93" text-anchor="middle" dominant-baseline="central" fill="currentColor" style="font-size:16px;font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif;font-style:italic;">b</text><text x="550" y="26" text-anchor="middle" dominant-baseline="central" fill="currentColor" style="font-size:14px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;font-weight:600;">1</text><text x="550" y="158" text-anchor="middle" dominant-baseline="central" fill="var(--hi)" style="font-size:14px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;font-weight:600;">5</text></svg><figcaption><strong>Why tight edges must be reachable from the source.</strong> The weight of <i>u</i>→<i>v</i> was 1 and is really 5; the old row of <i>u</i> says 0, 1, 0, 1. With <i>w</i>′ no edge is tense, and every vertex has a tight incoming edge (blue: old label of the tail + weight = old label of the head) — <i>v</i> and <i>b</i> prop each other up around their cycle of length 0. But <i>u</i>→<i>v</i> is not tight (0 + 5 ≠ 1), so a search from <i>u</i> along tight edges never reaches <i>v</i> or <i>b</i>: their labels are too low (red). The out-neighbor shortcut is fooled as well: <i>w</i>(<i>u</i>→<i>a</i>) + dist[<i>a</i>, <i>v</i>] = 0 + 1 = dist[<i>u</i>, <i>v</i>], but that path to <i>v</i> runs through <i>u</i>→<i>v</i> itself.</figcaption></figure>
