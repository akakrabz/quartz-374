nt-size:12px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;">positions 0–6; shaded: spacers 0, 3, 6; clause j sits at 3j − 2, 3j − 1</text></svg><figcaption><strong>3Sat → DirectedHamCycle, repaired</strong>, for (<i>a</i> ∨ <i>b</i>) ∧ (<i>ā</i> ∨ <i>b̄</i>). Each variable has a row of 3<i>k</i> + 1 = 7 vertices (a thin segment is a pair of opposite edges); shaded vertices are spacers, and clause <i>j</i> (red square) attaches at positions 3<i>j</i> − 2 and 3<i>j</i> − 1 — a rightward detour for a positive literal, a leftward one for a negative literal. Hub <i>h</i><sub><i>i</i></sub> leads into either end of row <i>i</i>, and both ends lead to the next hub (row <i>b</i> wraps around to <i>h</i><sub>1</sub>). Blue: the Hamiltonian cycle for <i>a</i> = True, <i>b</i> = False, which collects clause 1 on row <i>a</i> and clause 2 on row <i>b</i>. This graph has exactly two Hamiltonian cycles, one per satisfying assignment.</figcaption></figure>
